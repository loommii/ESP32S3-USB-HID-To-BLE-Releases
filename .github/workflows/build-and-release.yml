# ============================================================
# 固件 + 桌面客户端：构建与发布（公开仓库侧）
# ------------------------------------------------------------
# 为什么在公开仓库构建：
#   私有仓库的 GitHub Actions 受配额/支出上限限制，公开仓库免费。
#   本项目（ESP32S3-USB-HID-To-BLE）的私有源码仓库是：
#       loommii/ESP32S3-USB-HID-To-BLE   (master)
#   发布物（固件 + 桌面客户端）落在这个公开仓库。
#
# 与常见做法不同的五个点：
#   1. 发布前先做"版本一致性预检"，不一致立刻失败，不浪费 10 分钟构建
#   2. 私有源码凭据不落盘（persist-credentials: false）
#   3. 构建出的固件自动回写 flasher manifest 版本号，消除版本漂移
#   4. tag 指向真正包含该固件的提交，并记录源码 commit 溯源
#   5. 发布物附 SHA256SUMS；只上传发布物，绝不上传 .elf/.map
#
# 触发：Actions → Build & Release → Run workflow，填入私有仓库 tag 名称。
# ============================================================

name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '私有仓库 loommii/ESP32S3-USB-HID-To-BLE 的发布 tag（形如 V3.1.0）'
        required: true
        type: string
      skip_publish:
        description: '只构建与校验，不提交、不打 tag、不建 Release'
        required: false
        default: false
        type: boolean

# 同一 tag 的发布不并发；也不取消正在进行的发布（避免删掉半成品 Release）
concurrency:
  group: build-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  SOURCE_REPO: loommii/ESP32S3-USB-HID-To-BLE
  FW_BIN: esp32s3-usb-hid-ble.bin

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # 预检：几秒钟内拦下版本号不一致
  # ─────────────────────────────────────────────
  preflight:
    name: 预检 / 版本一致性
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      semver: ${{ steps.vars.outputs.semver }}
      source_sha: ${{ steps.src.outputs.sha }}
    steps:
      - name: 校验 tag 格式
        id: vars
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^V[0-9]+\.[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::tag 必须形如 V3.1.0，实际收到：${TAG}"
            exit 1
          fi
          echo "tag=${TAG}"        >> "$GITHUB_OUTPUT"
          echo "semver=${TAG#V}"   >> "$GITHUB_OUTPUT"

      - name: 检出私有源码（只读，凭据不落盘）
        uses: actions/checkout@v4
        with:
          repository: loommii/ESP32S3-USB-HID-To-BLE
          ref: ${{ inputs.tag }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: src

      - name: 记录源码提交 SHA
        id: src
        run: echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 校验四处版本号一致
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 - "${TAG}" <<'PY'
          import json, pathlib, re, sys

          tag = sys.argv[1]
          semver = tag[1:]
          bad = []

          cfg = pathlib.Path("src/main/config.h").read_text(encoding="utf-8")
          m = re.search(r'#define\s+PROJECT_VERSION\s+"([^"]+)"', cfg)
          if not m:
              bad.append("main/config.h 中找不到 PROJECT_VERSION 宏")
          elif m.group(1) != tag:
              bad.append(f"main/config.h PROJECT_VERSION = {m.group(1)!r}，应为 {tag!r}")

          for path, label in (
              ("src/desktop/package.json", "desktop/package.json"),
              ("src/desktop/src-tauri/tauri.conf.json", "desktop/src-tauri/tauri.conf.json"),
          ):
              try:
                  v = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))["version"]
              except Exception as e:
                  bad.append(f"{label} 读取失败：{e}")
                  continue
              if v != semver:
                  bad.append(f"{label} version = {v!r}，应为 {semver!r}")

          if bad:
              for b in bad:
                  print(f"::error::{b}")
              sys.exit(1)

          print(f"版本一致：{tag} / config.h / package.json / tauri.conf.json")
          PY

  # ─────────────────────────────────────────────
  # 固件构建（ESP-IDF 容器）
  # ─────────────────────────────────────────────
  build-firmware:
    name: 固件构建
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v6.1
    # 容器内默认 shell 是 sh(dash)，不支持 set -o pipefail，显式指定 bash
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出私有源码（只读）
        uses: actions/checkout@v4
        with:
          repository: loommii/ESP32S3-USB-HID-To-BLE
          ref: ${{ inputs.tag }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: 编译并合并为单文件（offset 0，供网页烧录）
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          # -DPROJECT_VER：让 app descriptor 记录真实版本（默认会退化成 "1"）
          idf.py -DPROJECT_VER="${TAG}" set-target esp32s3
          idf.py -DPROJECT_VER="${TAG}" build
          mkdir -p "$GITHUB_WORKSPACE/out"
          idf.py merge-bin -o "$GITHUB_WORKSPACE/out/esp32s3-usb-hid-ble.bin" -f raw

      - name: 校验固件内嵌版本
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 - "${TAG}" <<'PY'
          import json, pathlib, struct, sys

          tag = sys.argv[1]
          desc = json.loads(pathlib.Path("build/project_description.json").read_text())
          # app_bin 是相对 build/ 的裸文件名，不是项目根目录相对路径
          app_path = pathlib.Path(desc.get("build_dir") or "build") / desc["app_bin"]
          if not app_path.exists():
              app_path = pathlib.Path("build") / pathlib.Path(desc["app_bin"]).name
          app = app_path.read_bytes()
          base = 0x20  # esp_app_desc_t 在 app 镜像中的偏移
          magic = struct.unpack_from("<I", app, base)[0]
          if magic != 0xABCD5432:
              sys.exit(f"app descriptor magic 不匹配：{magic:#010x}")
          version = app[base + 16: base + 48].split(b"\x00")[0].decode()
          print(f"app descriptor version = {version}")
          if version != tag:
              sys.exit(f"::error::固件版本 {version!r} 与 tag {tag!r} 不一致")
          PY

      - name: 上传固件产物（仅 .bin）
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/esp32s3-usb-hid-ble.bin
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────
  # 桌面客户端（Tauri 矩阵）
  # ─────────────────────────────────────────────
  build-desktop:
    name: 桌面客户端 ${{ matrix.label }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: windows-latest
            target: ''
            label: Windows-x64
          - platform: ubuntu-22.04
            target: ''
            label: Linux-x64
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - name: 检出私有源码（只读）
        uses: actions/checkout@v4
        with:
          repository: loommii/ESP32S3-USB-HID-To-BLE
          ref: ${{ inputs.tag }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装前端依赖
        working-directory: desktop
        run: npm ci

      # prost-build 需要 protoc；统一用跨平台 action 替代 brew/choco，省 3-5 分钟
      - name: 安装 protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '27.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libbluetooth-dev libssl-dev

      - name: 安装 Rust 交叉编译目标
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.label }}

      - name: 构建 Tauri 客户端
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: 上传客户端产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: |
            desktop/src-tauri/target/${{ matrix.target || '**' }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target || '**' }}/release/bundle/**/*.exe
            desktop/src-tauri/target/${{ matrix.target || '**' }}/release/bundle/**/*.msi
            desktop/src-tauri/target/${{ matrix.target || '**' }}/release/bundle/**/*.deb
            desktop/src-tauri/target/${{ matrix.target || '**' }}/release/bundle/**/*.AppImage
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────
  # 发布：落盘固件 → 回写 manifest → 打 tag → 建 Release
  # ─────────────────────────────────────────────
  publish:
    name: 发布
    needs: [preflight, build-firmware, build-desktop]
    if: ${{ inputs.skip_publish == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 落盘固件并回写 manifest 版本
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail

          BIN="$(find artifacts -name "${FW_BIN}" -type f | head -1)"
          test -n "${BIN}" || { echo "::error::未找到固件产物"; exit 1; }

          install -D -m 0644 "${BIN}" "docs/public/firmware/${FW_BIN}"

          # 关键：让网页烧录页显示的版本号与固件真实版本一致
          jq --arg v "${TAG}" '.version = $v' docs/public/flasher/manifest.json > manifest.tmp
          mv manifest.tmp docs/public/flasher/manifest.json

          cat > docs/public/firmware/build-info.json <<EOF
          {
            "version": "${TAG}",
            "source_repo": "${SOURCE_REPO}",
            "source_commit": "${SHA}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "bin": "${FW_BIN}",
            "sha256": "$(sha256sum "docs/public/firmware/${FW_BIN}" | cut -d' ' -f1)"
          }
          EOF

          echo "manifest version → ${TAG}"

      - name: 准备发布资产
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "docs/public/firmware/${FW_BIN}" "dist/esp32s3-usb-hid-ble-${TAG}.bin"
          find artifacts -type f \( \
              -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o \
              -name '*.deb' -o -name '*.AppImage' \
            \) -exec cp {} dist/ \;
          ( cd dist && sha256sum ./* > SHA256SUMS.txt )
          ls -lh dist

      - name: 提交固件与 manifest
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/public/firmware docs/public/flasher/manifest.json
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "release: ${TAG} firmware + flasher manifest"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
          SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail

          NOTES="$(cat <<EOF
          ## ${TAG}

          - 源码：`${SOURCE_REPO}@${SHA}`
          - 构建：GitHub Actions 公开仓库 runner（run #${{ github.run_number }}）
          - 固件：单文件合并镜像（offset 0），可直接用网页烧录
          - 校验：见 `SHA256SUMS.txt`
          EOF
          )"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release 已存在，覆盖资产"
          elif git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            gh release create "${TAG}" --title "${TAG}" --notes "${NOTES}"
          else
            # tag 指向包含本固件的提交，而不是随意的 HEAD
            gh release create "${TAG}" --target "$(git rev-parse HEAD)" \
              --title "${TAG}" --notes "${NOTES}"
          fi

          gh release upload "${TAG}" dist/* --clobber

      - name: 汇总
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          {
            echo "### ${TAG} 发布完成"
            echo ""
            echo "- Release: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            echo "- 烧录页: https://loommii.github.io/ESP32S3-USB-HID-To-BLE-Releases/flasher"
            echo "- 固件版本校验: 通过"
          } >> "$GITHUB_STEP_SUMMARY"
