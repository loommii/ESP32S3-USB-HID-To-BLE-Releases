---
name: Probe build-desktop
concurrency:
  group: build-release-${{ inputs.tag }}
  cancel-in-progress: false
env:
  SOURCE_REPO: loommii/ESP32S3-USB-HID-To-BLE
  FW_BIN: esp32s3-usb-hid-ble.bin
permissions:
  contents: read
jobs:
  build-desktop:
    name: 桌面客户端 ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: macos-latest
          target: aarch64-apple-darwin
          label: macOS-aarch64
        - platform: macos-latest
          target: x86_64-apple-darwin
          label: macOS-x64
        - platform: windows-latest
          target: ''
          label: Windows-x64
        - platform: ubuntu-22.04
          target: ''
          label: Linux-x64
    runs-on: "${{ matrix.platform }}"
    timeout-minutes: 45
    steps:
    - name: 检出私有源码（只读）
      uses: actions/checkout@v4
      with:
        repository: loommii/ESP32S3-USB-HID-To-BLE
        ref: "${{ inputs.tag }}"
        token: "${{ secrets.PRIVATE_REPO_TOKEN }}"
        persist-credentials: false
        fetch-depth: 1
    - name: 安装 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: desktop/package-lock.json
    - name: 安装前端依赖
      working-directory: desktop
      run: npm ci
    - name: 安装 protoc
      uses: arduino/setup-protoc@v3
      with:
        version: '27.1'
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
    - name: 安装 Linux 系统依赖
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
          librsvg2-dev patchelf libbluetooth-dev libssl-dev
    - name: 安装 Rust 交叉编译目标
      if: matrix.target == 'x86_64-apple-darwin'
      run: rustup target add x86_64-apple-darwin
    - name: Rust 构建缓存
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: desktop/src-tauri -> target
        key: "${{ matrix.label }}"
    - name: 构建 Tauri 客户端
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      with:
        projectPath: desktop
        args: "${{ matrix.target && format('--target {0}', matrix.target) || '' }}"
    - name: 上传客户端产物
      uses: actions/upload-artifact@v4
      with:
        name: desktop-${{ matrix.label }}
        path: |
          desktop/src-tauri/target/${{ matrix.target || '**' }}/release/bundle/**/*.dmg
          desktop/src-tauri/target/${{ matrix.target || '**' }}/release/bundle/**/*.exe
          desktop/src-tauri/target/${{ matrix.target || '**' }}/release/bundle/**/*.msi
          desktop/src-tauri/target/${{ matrix.target || '**' }}/release/bundle/**/*.deb
          desktop/src-tauri/target/${{ matrix.target || '**' }}/release/bundle/**/*.AppImage
        if-no-files-found: error
        retention-days: 7
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: 私有仓库 loommii/ESP32S3-USB-HID-To-BLE 的发布 tag（形如 V3.1.0）
        required: true
        type: string
      skip_publish:
        description: 只构建与校验，不提交、不打 tag、不建 Release
        required: false
        default: false
        type: boolean
